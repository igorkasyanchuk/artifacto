# Name of your application. Used to uniquely configure containers.
service: artifacto

# Name of the container image (use your-user/app-name on external registries).
image: artifacto

# Deploy to these servers.
servers:
  web:
    - 1.2.3.4   # your Hetzner box

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
#
# Deliberately no `host:` and no `ssl:`. The proxy has to answer for the app host
# AND for every <slug>.CONTENT_HOST subdomain, and Let's Encrypt cannot issue that
# wildcard over HTTP-01. TLS is terminated at Cloudflare and the last hop runs
# through a Cloudflare Tunnel (the `tunnel` accessory below), so this box needs no
# certificate and no inbound port open to the internet at all.
proxy:
  app_port: 80

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: localhost:5555

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - SECRET_KEY_BASE
    - ARTIFACTO_DATABASE_PASSWORD
    - IP_HASH_SECRET        # HMAC key for creator_ip_hash; rotating it orphans existing bans
    - ADMIN_USER
    - ADMIN_PASSWORD
    - CF_ZONE_ID            # content zone, for purge-on-update
    - CF_API_TOKEN
    - AR_ENCRYPTION_PRIMARY_KEY        # encrypts artifacts.creator_ip
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_SALT
  clear:
    APP_ORIGIN: https://artifacto.app
    CONTENT_HOST: artifactousercontent.com
    MAX_UPLOAD_BYTES: 5242880
    DEFAULT_TTL_DAYS: 14
    DB_HOST: artifacto-db
    REDIS_URL: redis://artifacto-redis:6379/0
    # Run Sidekiq inside the web server's Puma process. Single-process Puma only —
    # split jobs into their own container before setting WEB_CONCURRENCY.
    SIDEKIQ_IN_PUMA: true

    # Number of Sidekiq threads (default: 3)
    # SIDEKIQ_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use artifacto-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.5
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
# accessories:
#   db:
#     image: mysql:8.0
#     host: 192.168.0.2
#     # Change to 3306 to expose port to the world instead of just local network.
#     port: "127.0.0.1:3306:3306"
#     env:
#       clear:
#         MYSQL_ROOT_HOST: '%'
#       secret:
#         - MYSQL_ROOT_PASSWORD
#     files:
#       - config/mysql/production.cnf:/etc/mysql/my.cnf
#       - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
#     directories:
#       - data:/var/lib/mysql
#   redis:
#     image: valkey/valkey:8
#     host: 192.168.0.2
#     port: 6379
#     directories:
#       - data:/data

# Postgres on the same box, plus the tunnel that fronts it all.
# No backup job on purpose: artifacts live 14 days and are reproducible by the
# agent that made them. See README before adding one.
accessories:
  db:
    image: postgres:17
    host: 1.2.3.4
    env:
      clear:
        POSTGRES_USER: artifacto
        POSTGRES_DB: artifacto_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

  redis:
    image: valkey/valkey:8
    host: 1.2.3.4
    cmd: valkey-server --maxmemory-policy noeviction --appendonly yes
    directories:
      - data:/data

  # Outbound-only connection to Cloudflare: no port 80/443 exposed on the host.
  # Point both public hostnames at http://kamal-proxy:80 in the tunnel config.
  tunnel:
    image: cloudflare/cloudflared:latest
    host: 1.2.3.4
    cmd: tunnel --no-autoupdate run
    env:
      secret:
        - TUNNEL_TOKEN
